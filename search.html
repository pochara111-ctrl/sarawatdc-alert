<!DOCTYPE html>
<html lang="th"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#14306b"/>
<title>ค้นประวัติการแจ้งเหตุ – เดชะปัตตนยานุกูล</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/report.css"/><link rel="stylesheet" href="css/ui.css"/>
<style>.wrap{max-width:820px}.sb{display:flex;gap:.6rem}.sb .inp{flex:1}.sb button{border:0;background:var(--blue);color:#fff;font:800 1rem Sarabun;padding:0 1.3rem;border-radius:14px;cursor:pointer}
.hint{color:var(--mut);font-size:.8rem;margin-top:.5rem}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.7rem;margin-bottom:1rem}
.tile{background:var(--card);border-radius:16px;padding:.8rem 1rem;box-shadow:var(--sh)}.tile small{color:var(--mut);font-weight:700;font-size:.75rem}.tile b{display:block;font-size:1.5rem;color:var(--navy)}
.it{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:1rem 1.1rem;margin-bottom:.8rem;border-left:5px solid var(--red);animation:ui-up .4s both}
.it.done{border-left-color:var(--ok)}.it.progress{border-left-color:#f59e0b}
.it h3{font-size:1rem;display:flex;justify-content:space-between;gap:.5rem;align-items:center}.it .r{font-size:.84rem;color:#3b4766;margin-top:.25rem}.it .r b{color:var(--ink)}
.tg{font-size:.7rem;border-radius:50px;padding:.1rem .6rem;font-weight:800;background:#fee2e2;color:#b91c1c}.tg.done{background:#dcfce7;color:#15803d}.tg.progress{background:#fef3c7;color:#b45309}
.it a{color:var(--blue);font-weight:700;font-size:.82rem;text-decoration:none}</style></head><body>
<header class="hero" style="padding-bottom:4.2rem"><div class="hero-in"><div class="logo">🔎</div><div><h1>ค้นประวัติการแจ้งเหตุ</h1><p>ค้นด้วยรหัสนักเรียน ชื่อ-สกุล เบอร์โทร หรือชั้น</p></div></div></header>
<main class="wrap" style="margin-bottom:3rem">
<section class="sec ui-stagger-card"><div class="sb"><input id="q" class="inp" placeholder="เช่น 12345 / สมชาย ใจดี / 0812345678 / ม.2/1" autocomplete="off"/><button id="go">ค้นหา</button></div>
<div class="hint">ค้นได้หลายคำพร้อมกัน (ชื่อ นามสกุล ชั้น) • ผลลัพธ์รวมทั้งที่เป็นผู้แจ้งและนักเรียนที่เกี่ยวข้อง</div></section>
<div class="tiles" id="tiles"></div><div id="res"></div>
<p style="text-align:center"><a href="dashboard.html" style="color:var(--navy);font-weight:700">← กลับหน้าแผนที่</a></p></main>
<script src="js/ui.js"></script><script src="js/fx.js"></script><script src="js/config.js"></script>
<script>
const $=id=>document.getElementById(id),token=sessionStorage.getItem('tok'),esc=UI.esc;if(!token)location.href='index.html';
const ST={new:'รอดำเนินการ',progress:'กำลังดำเนินการ',done:'เสร็จสิ้น'},fmt=t=>new Date(+t).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
async function go(){const q=$('q').value.trim();if(!q)return UI.toast('พิมพ์คำค้นก่อน','info');
  UI.busy($('go'),true,'กำลังค้น…');
  try{const items=(await api('search',{token,q})).items.filter(i=>!i.mergedInto);
    const ty={};items.forEach(i=>ty[i.type]=(ty[i.type]||0)+1);const top=Object.entries(ty).sort((a,b)=>b[1]-a[1])[0];
    $('tiles').innerHTML=items.length?[['พบทั้งหมด',items.length+' เหตุ'],['เหตุที่พบบ่อย',top?esc(top[0]):'-'],['ล่าสุด',fmt(items[0].time)],['ยังไม่ปิด',items.filter(i=>i.status!=='done').length]].map(t=>`<div class="tile"><small>${t[0]}</small><b style="font-size:${t[0]==='เหตุที่พบบ่อย'||t[0]==='ล่าสุด'?'.95rem':'1.5rem'}">${t[1]}</b></div>`).join(''):'';
    $('res').innerHTML=items.length?items.map(i=>`<div class="it ${i.status}"><h3><span>${i.urgent?'🔴 ':''}#${esc(i.no)} ${esc(i.type)}</span><span class="tg ${i.status}">${ST[i.status]}</span></h3>
      <div class="r">🕒 ${fmt(i.time)} • 📡 ${esc(i.channel||'หน้าเว็บ')}</div>
      <div class="r">📍 ${esc(i.location)||'-'}</div>
      <div class="r">👤 <b>${esc(i.reporter)}</b> (${esc(i.role)})${i.phone?' • 📞 '+esc(i.phone):''}${i.cls?' • ชั้น '+esc(i.cls):''}${i.sid?' • รหัส '+esc(i.sid):''}</div>
      ${i.students?`<div class="r">🎒 ${esc(i.students)}</div>`:''}${i.detail?`<div class="r">📝 ${esc(i.detail)}</div>`:''}
      ${i.assignee?`<div class="r">🧑‍✈️ ผู้รับผิดชอบ: ${esc(i.assignee)}</div>`:''}${i.note?`<div class="r" style="color:#15803d">✅ ผล: ${esc(i.note)}</div>`:''}
      <div class="r" style="margin-top:.5rem"><a href="dashboard.html?focus=${esc(i.id)}">เปิดบนแผนที่ →</a></div></div>`).join(''):'<div class="sec" style="text-align:center;color:var(--mut)">ไม่พบประวัติที่ตรงกับคำค้น</div>';
  }catch(e){UI.toast(e.message,'err');if(/unauthorized/.test(e.message))location.href='index.html';}UI.busy($('go'),false);}
$('go').onclick=go;$('q').onkeydown=e=>{if(e.key==='Enter')go();};$('q').focus();
</script></body></html>
